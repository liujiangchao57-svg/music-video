<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-touch-fullscreen" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Ccircle cx='96' cy='96' r='96' fill='%230a0a12'/%3E%3Ccircle cx='96' cy='96' r='40' fill='none' stroke='%23e94560' stroke-width='2'/%3E%3Ccircle cx='96' cy='96' r='10' fill='%23e94560'/%3E%3Ctext x='96' y='165' text-anchor='middle' fill='%23e94560' font-family='sans-serif' font-size='16' font-weight='bold'%3EMV%3C/text%3E%3C/svg%3E">
<title>AI Music Video</title>
<style>
:root{
  --accent:#e94560;--accent-r:233;--accent-g:69;--accent-b:96;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;width:100%;overflow:hidden;position:fixed;
  background:#000;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}

/* ===== 预览画面 ===== */
.preview{
  position:fixed;inset:0;overflow:hidden;background:#0a0a12;z-index:1;
}

.bg-layer{
  position:absolute;inset:-5%;
  background:linear-gradient(135deg,#0a0a12 0%,#1a1a2e 30%,#16213e 60%,#0d1117 100%);
  animation:bgShift 30s ease-in-out infinite;
}
.bg-layer.has-image{
  background:var(--user-bg) center/cover no-repeat;
  filter:blur(12px) brightness(.35) saturate(1.3);
}
@keyframes bgShift{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.05) rotate(.5deg)}50%{transform:scale(1.08) rotate(0)}75%{transform:scale(1.03) rotate(-.5deg)}}

.vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.7) 100%);
}
.top-fade{
  position:absolute;top:0;left:0;right:0;height:18%;
  background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent);
}
.bottom-fade{
  position:absolute;bottom:0;left:0;right:0;height:25%;
  background:linear-gradient(to top,rgba(0,0,0,.75),transparent);
}

/* 粒子 */
.particles{position:absolute;inset:0}
.particle{
  position:absolute;border-radius:50%;animation:pFloat linear infinite;
}
@keyframes pFloat{
  0%{transform:translateY(110%) scale(0);opacity:0}
  5%{opacity:1}85%{opacity:.8}
  100%{transform:translateY(-10%) scale(1.2);opacity:0}
}

/* 唱片 */
.record-zone{
  position:absolute;top:5%;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;z-index:5;
  animation:recIn .8s ease-out forwards;opacity:0;
}
@keyframes recIn{
  0%{opacity:0;transform:translateX(-50%) translateY(-20px) scale(.7)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
}
.record-container{width:42vw;max-width:200px;aspect-ratio:1;position:relative}

.record-disc{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at center,#1a1a1a 0%,#1a1a1a 39%,#2a2a2a 40%,#222 42%,repeating-radial-gradient(circle at center,#1a1a1a 0px,#1a1a1a 2px,#252525 3px,#1a1a1a 4px) 43% 80%,#111 81%,#0d0d0d 100%);
  box-shadow:0 0 30px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.25),0 0 60px rgba(0,0,0,.3);
  animation:spin 4s linear infinite;position:relative;overflow:hidden;
}
.record-disc.has-user{background:var(--user-disc) center/cover no-repeat}
@keyframes spin{to{transform:rotate(360deg)}}

.record-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:40%;aspect-ratio:1;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  box-shadow:0 0 15px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.3),inset 0 0 10px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;
}
.record-label.has-cover{background:var(--user-cover) center/cover no-repeat}
.record-label .lbl-song{
  color:#fff;font-size:min(13px,3.2vw);font-weight:600;
  text-shadow:0 0 8px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.4);
  text-align:center;padding:0 12%;line-height:1.3;transition:opacity .3s;
}
.record-label.has-cover .lbl-song{opacity:0}
.record-label .lbl-line{
  width:50%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);
  margin:6% 0;transition:opacity .3s;
}
.record-label.has-cover .lbl-line{opacity:0}
.record-label .lbl-style{
  color:rgba(255,255,255,.4);font-size:min(9px,2vw);letter-spacing:.5px;transition:opacity .3s;
}
.record-label.has-cover .lbl-style{opacity:0}
.record-hole{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:9%;aspect-ratio:1;border-radius:50%;background:#0a0a12;z-index:3;
}

.tonearm{
  position:absolute;top:2%;right:5%;width:30%;height:2px;
  background:linear-gradient(90deg,rgba(200,200,200,.55),rgba(140,140,140,.25));
  transform-origin:right center;transform:rotate(-22deg);z-index:6;border-radius:1px;
  animation:armIn 1.5s ease-out .5s forwards;
}
.tonearm::after{
  content:'';position:absolute;left:-3px;top:-4px;width:10px;height:10px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 8px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.4);
}
@keyframes armIn{0%{transform:rotate(-25deg)}100%{transform:rotate(-16deg)}}

/* 歌曲信息 */
.song-info{
  position:absolute;top:54%;left:50%;transform:translateX(-50%);
  text-align:center;z-index:5;
  animation:infoIn .6s ease-out .4s both;opacity:0;
}
@keyframes infoIn{0%{opacity:0;transform:translateX(-50%) translateY(15px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
.song-title{
  color:#fff;font-size:min(24px,6vw);font-weight:600;
  text-shadow:0 0 20px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.35);
  letter-spacing:2px;margin-bottom:4px;
}
.song-artist{color:rgba(255,255,255,.4);font-size:min(14px,3.5vw);letter-spacing:3px}
.song-badge{
  display:inline-block;margin-top:8px;padding:4px 14px;
  border:1px solid rgba(var(--accent-r),var(--accent-g),var(--accent-b),.4);
  border-radius:20px;font-size:min(11px,2.5vw);color:var(--accent);letter-spacing:.5px;
}

/* 歌词 */
.lyrics-zone{position:absolute;top:64%;left:50%;transform:translateX(-50%);width:85%;text-align:center;z-index:5}
.lyric-line{margin:6px 0;line-height:1.7;transition:all .4s ease}
.lyric-past{font-size:min(15px,3.6vw);color:rgba(255,255,255,.1)}
.lyric-active{font-size:min(19px,4.6vw);color:#fff;font-weight:500;text-shadow:0 0 12px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.25)}
.lyric-next{font-size:min(15px,3.6vw);color:rgba(255,255,255,.2)}

/* 频谱 */
.waveform-zone{
  position:absolute;bottom:4%;left:50%;transform:translateX(-50%);
  display:flex;gap:2px;align-items:flex-end;height:7%;z-index:5;
  animation:wfIn .6s ease-out 1s both;opacity:0;
}
@keyframes wfIn{to{opacity:1}}
.bar{
  width:min(4px,1vw);border-radius:2px;
  background:linear-gradient(to top,rgba(var(--accent-r),var(--accent-g),var(--accent-b),.85),rgba(var(--accent-r),var(--accent-g),var(--accent-b),.25));
  animation:bJump ease-in-out infinite;
}
@keyframes bJump{0%,100%{height:20%;opacity:.35}50%{height:var(--h);opacity:1}}

/* 进度点 */
.progress-dots{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:5}
.progress-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .3s}
.progress-dot.active{background:var(--accent);transform:scale(1.5)}

/* ===== 底部操作栏 —— 始终可见 ===== */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:8px 14px calc(8px + var(--safe-bottom));
  background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.6) 70%,transparent 100%);
  display:flex;align-items:center;gap:8px;
}
.bottom-bar .btn-config{
  display:flex;align-items:center;gap:6px;
  padding:10px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);color:#fff;font-size:14px;font-weight:500;
  cursor:pointer;font-family:inherit;letter-spacing:.5px;
  -webkit-tap-highlight-color:transparent;
  transition:all .15s;
}
.bottom-bar .btn-config:active{background:rgba(255,255,255,.15);transform:scale(.97)}
.bottom-bar .btn-config .gear{font-size:16px}

.bottom-bar .spacer{flex:1}

.bottom-bar .btn-play{
  width:44px;height:44px;border-radius:50%;border:none;
  background:var(--accent);color:#fff;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:all .15s;
  box-shadow:0 4px 15px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.3);
}
.bottom-bar .btn-play:active{filter:brightness(.85);transform:scale(.92)}

/* 全屏按钮 */
.bottom-bar .btn-fs{
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:all .15s;
}
.bottom-bar .btn-fs:active{background:rgba(255,255,255,.12);color:#fff}

/* ===== 配置抽屉 ===== */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.drawer-backdrop.open{opacity:1;pointer-events:auto}

.drawer{
  position:fixed;bottom:0;left:0;right:0;max-height:75vh;
  background:#1a1a1e;border-radius:20px 20px 0 0;z-index:70;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;padding-bottom:var(--safe-bottom);
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
}
.drawer.open{transform:translateY(0)}
.drawer-handle{width:36px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin:12px auto 4px}
.drawer-title{text-align:center;color:#fff;font-size:16px;font-weight:600;margin-bottom:4px}
.drawer-body{flex:1;overflow-y:auto;padding:12px 18px;-webkit-overflow-scrolling:touch}

/* 图片选择 */
.img-pick-row{display:flex;gap:8px;margin-bottom:14px}
.img-pick-btn{
  flex:1;padding:10px 6px;background:#111;border:1px dashed #333;
  border-radius:10px;color:rgba(255,255,255,.5);font-size:11px;
  text-align:center;cursor:pointer;font-family:inherit;
  transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.img-pick-btn:active{background:#1a1a2e;border-color:var(--accent)}
.img-pick-btn .icon{font-size:20px}
.img-pick-btn .label{font-size:9px;color:rgba(255,255,255,.25)}
.img-pick-btn.has-img{border-color:var(--accent);border-style:solid}
.img-pick-btn.has-img .label{color:var(--accent)}

/* 表单 */
.field{margin-bottom:14px}
.field label{display:block;color:rgba(255,255,255,.5);font-size:12px;margin-bottom:5px;font-weight:500}
.field input,.field textarea,.field select{
  width:100%;background:#111;border:1px solid #2a2a2a;color:#fff;
  padding:10px 12px;border-radius:10px;font-size:15px;
  font-family:inherit;outline:none;-webkit-appearance:none;transition:border-color .2s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:130px;line-height:1.7;resize:vertical;font-size:14px}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}

.btn-primary{
  width:100%;padding:13px;background:var(--accent);border:none;color:#fff;
  font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;
  font-family:inherit;letter-spacing:.5px;
  -webkit-tap-highlight-color:transparent;transition:all .15s;
}
.btn-primary:active{filter:brightness(.85);transform:scale(.98)}

.btn-secondary{
  width:100%;padding:12px;background:transparent;border:1px solid #333;
  color:rgba(255,255,255,.5);font-size:13px;border-radius:10px;
  cursor:pointer;font-family:inherit;margin-top:8px;transition:all .15s;
}
.btn-secondary:active{border-color:#555;color:#fff}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row .btn-secondary{flex:1;margin-top:0}

/* Toast */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
  background:rgba(0,0,0,.88);border:1px solid var(--accent);
  color:#fff;padding:14px 24px;border-radius:10px;font-size:14px;
  z-index:200;opacity:0;pointer-events:none;transition:all .25s;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 倒计时 */
.countdown-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.countdown-overlay.show{opacity:1;pointer-events:auto}
.countdown-num{font-size:120px;font-weight:700;color:var(--accent)}
.countdown-hint{position:absolute;bottom:28%;text-align:center;color:rgba(255,255,255,.5);font-size:15px}

/* 播放完成 */
.done-hint{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:var(--accent);font-size:20px;font-weight:600;z-index:55;
  opacity:0;pointer-events:none;transition:opacity .5s;
  text-shadow:0 0 20px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.4);
}
.done-hint.show{opacity:1}

/* 全屏引导弹窗 */
.fs-guide{
  position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .3s;
}
.fs-guide-content{
  width:85%;max-width:320px;background:#1a1a1e;border-radius:16px;
  padding:24px 20px 20px;position:relative;
  border:1px solid rgba(255,255,255,.08);
}
.fs-guide-close{
  position:absolute;top:12px;right:14px;color:rgba(255,255,255,.3);
  font-size:18px;cursor:pointer;width:32px;height:32px;display:flex;
  align-items:center;justify-content:center;border-radius:50%;
  -webkit-tap-highlight-color:transparent;
}
.fs-guide-close:active{background:rgba(255,255,255,.1);color:#fff}
.fs-guide-icon{font-size:48px;text-align:center;margin-bottom:6px}
.fs-guide-title{color:#fff;font-size:18px;font-weight:600;text-align:center;margin-bottom:16px}
.fs-guide-step{
  display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.7);
  font-size:14px;line-height:1.6;padding:6px 0;
}
.fs-guide-step span{
  width:22px;height:22px;border-radius:50%;background:var(--accent);
  color:#fff;font-size:12px;font-weight:600;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;
}
.fs-guide-step b{color:#fff;font-weight:600}
.fs-guide-note{
  color:rgba(255,255,255,.2);font-size:11px;text-align:center;
  margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06);
}

/* 隐藏元素 */
#fileCover,#fileBg,#fileDisc{display:none}
#expCanvas{display:none}
</style>
</head>
<body>

<!-- ====== 预览画面 ====== -->
<div class="preview" id="preview">
  <div class="bg-layer" id="bgLayer"></div>
  <div class="vignette"></div>
  <div class="particles" id="particles"></div>
  <div class="top-fade"></div>
  <div class="bottom-fade"></div>

  <div class="record-zone">
    <div class="record-container">
      <div class="record-disc" id="disc">
        <div class="record-label" id="label">
          <span class="lbl-song" id="lblSong">宿命解绑</span>
          <div class="lbl-line"></div>
          <span class="lbl-style" id="lblStyle">Urban R&B</span>
          <div class="record-hole"></div>
        </div>
      </div>
    </div>
    <div class="tonearm"></div>
  </div>

  <div class="song-info">
    <div class="song-title" id="sTitle">宿命解绑</div>
    <div class="song-artist" id="sArtist">lucky</div>
    <div class="song-badge" id="sBadge">Urban Cold R&B / 75BPM</div>
  </div>

  <div class="lyrics-zone" id="lyrZone"></div>
  <div class="waveform-zone" id="wfZone"></div>
  <div class="progress-dots" id="progDots"></div>
</div>

<!-- ====== 底部操作栏（始终可见） ====== -->
<div class="bottom-bar" id="bottomBar">
  <button class="btn-config" onclick="openDrawer()">
    <span class="gear">⚙️</span> 配置
  </button>
  <span class="spacer"></span>
  <button class="btn-play" id="btnPlay" onclick="startPlay()">▶</button>
  <button class="btn-fs" onclick="showFsGuide()">⤢</button>
</div>

<!-- ====== 倒计时 ====== -->
<div class="countdown-overlay" id="countdown">
  <div class="countdown-num" id="cdNum"></div>
  <div class="countdown-hint" id="cdHint"></div>
</div>

<!-- ====== 播放完成 ====== -->
<div class="done-hint" id="doneHint">♪ 播放完成 — 停止录屏吧</div>

<!-- ====== 配置抽屉 ====== -->
<div class="drawer-backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">⚙️ 配置</div>
  <div class="drawer-body">
    <div class="img-pick-row">
      <div class="img-pick-btn" id="pickCover" onclick="pickImage('cover')">
        <span class="icon">🖼️</span><span>专辑封面</span>
        <span class="label">点击替换</span>
      </div>
      <div class="img-pick-btn" id="pickBg" onclick="pickImage('bg')">
        <span class="icon">🌃</span><span>动态背景</span>
        <span class="label">点击替换</span>
      </div>
      <div class="img-pick-btn" id="pickDisc" onclick="pickImage('disc')">
        <span class="icon">💿</span><span>唱片盘面</span>
        <span class="label">点击替换</span>
      </div>
    </div>

    <div class="field">
      <label>歌名</label>
      <input type="text" id="iName" value="宿命解绑" placeholder="输入歌名">
    </div>
    <div class="field">
      <label>歌手</label>
      <input type="text" id="iArtist" value="lucky" placeholder="输入歌手名">
    </div>
    <div class="field">
      <label>风格标签</label>
      <input type="text" id="iStyle" value="Urban Cold R&B / 75BPM" placeholder="如：City Pop / 98BPM">
    </div>

    <div class="row2">
      <div class="field">
        <label>主题色</label>
        <select id="iColor">
          <option value="#e94560">品红（伤感）</option>
          <option value="#6c5ce7">紫色（梦幻）</option>
          <option value="#00cec9">青色（空灵）</option>
          <option value="#fdcb6e">金色（温暖）</option>
          <option value="#55efc4">薄荷（清新）</option>
          <option value="#74b9ff">天蓝（抒情）</option>
        </select>
      </div>
      <div class="field">
        <label>切换间隔</label>
        <select id="iInterval">
          <option value="3">3秒</option>
          <option value="3.5" selected>3.5秒</option>
          <option value="4">4秒</option>
          <option value="4.5">4.5秒</option>
          <option value="5">5秒</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>歌词（一行一句，空行分段）</label>
      <textarea id="iLyrics" placeholder="粘贴歌词到这里...">我把回忆折成纸飞机
扔进这个城市的霓虹里
却怎么也飞不出你的领地

宿命给的绳子越绑越紧
凌晨三点的街头只剩影子

手机屏幕亮了又暗
解绑 两个字打了又删
原来放手比坚持更难</textarea>
    </div>

<!-- JSZip 仅在导出时需要，页面核心功能不依赖 -->
<script>
// 如果 JSZip 不可用（离线或CDN不通），导出功能优雅降级
if(typeof JSZip==='undefined'){window.JSZip=null}

<script>
// ===== 状态 =====

// ===== 初始化 =====
loadConfig(); applyConfig(); initParticles(); initWaveform();

// ===== iOS Safari 地址栏隐藏技巧 =====
// 让 body 略微超出视口，自动滚 1px 触 Safari 发隐藏地址栏
(function(){

  setTimeout(function(){window.scrollTo(0,1)},200);
  // 用户点击时如果页面没滚动过，再触发一次
  var scrolled=false;
  window.addEventListener('scroll',function(){scrolled=true});
  document.addEventListener('touchstart',function(){
    if(!scrolled)setTimeout(function(){window.scrollTo(0,1)},50);
  },{once:true});
})();

// ===== 粒子 =====
function initParticles(){
  var el=document.getElementById('particles');el.innerHTML='';
  for(var i=0;i<35;i++){
    var p=document.createElement('div');p.className='particle';
    var s=Math.random()*3+1, isAccent=Math.random()>.7;
    p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+Math.random()*100+'%;background:'+(isAccent?'var(--accent)':'rgba(150,180,255,.45)')+';animation-duration:'+(Math.random()*12+6)+'s;animation-delay:'+(Math.random()*10)+'s';
    el.appendChild(p);
  }
}

// ===== 频谱 =====
function initWaveform(){
  var el=document.getElementById('wfZone');el.innerHTML='';
  for(var i=0;i<48;i++){
    var b=document.createElement('div');b.className='bar';
    b.style.setProperty('--h',(25+Math.random()*75)+'%');

    b.style.animationDelay=(Math.random()*.4)+'s';
    el.appendChild(b);
  }
}

// ===== 颜色 =====
function setColor(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);

  s.setProperty('--accent',hex);s.setProperty('--accent-r',r);s.setProperty('--accent-g',g);s.setProperty('--accent-b',b);
}

// ===== 应用配置 =====
function apply(){applyConfig();saveConfig();showToast('配置已应用 ✓');closeDrawer();}

function applyConfig(){
  var name=document.getElementById('iName').value.trim()||'未命名';
  var artist=document.getElementById('iArtist').value.trim()||'未知歌手';
  var style=document.getElementById('iStyle').value.trim();
  var color=document.getElementById('iColor').value;
  var lyrText=document.getElementById('iLyrics').value;
  var interval=parseFloat(document.getElementById('iInterval').value)||3.5;

  setColor(color);
  var bgLayer=document.getElementById('bgLayer');
  if(userImages.bg){bgLayer.style.setProperty('--user-bg','url('+userImages.bg+')');bgLayer.classList.add('has-image')}
  else{bgLayer.classList.remove('has-image')}

  var disc=document.getElementById('disc');
  if(userImages.disc){disc.style.setProperty('--user-disc','url('+userImages.disc+')');disc.classList.add('has-user')}
  else{disc.classList.remove('has-user')}

  var label=document.getElementById('label'), lblSong=document.getElementById('lblSong'), lblStyle=document.getElementById('lblStyle');

  lblStyle.textContent=style.split('/')[0].trim();

  document.getElementById('sTitle').textContent=name;
  document.getElementById('sArtist').textContent=artist;
  document.getElementById('sBadge').textContent=style;
  document.title=name+' - '+artist;

  lyrics=parseLyr(lyrText);lIdx=0;stopPlay();updateLyrics();
}

function parseLyr(t){return t.split('\n').map(function(l){return l.trim()}).filter(function(l){return l.length>0})}

// ===== 歌词更新 =====
function updateLyrics(){
  var el=document.getElementById('lyrZone');
  if(!lyrics.length){el.innerHTML='';return}
  var past=Math.max(0,lIdx-1), html='';
  if(past<lyrics.length)html+='<div class="lyric-line lyric-past">'+escHtml(lyrics[past])+'</div>';
  html+='<div class="lyric-line lyric-active">'+escHtml(lyrics[lIdx])+'</div>';
  if(lIdx+1<lyrics.length)html+='<div class="lyric-line lyric-next">'+escHtml(lyrics[lIdx+1])+'</div>';
  el.innerHTML=html;
  updateProgressDots();
  lIdx++;
  if(lIdx>=lyrics.length){stopPlay();showDoneHint()}
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function updateProgressDots(){
  var el=document.getElementById('progDots');
  if(!lyrics.length){el.innerHTML='';return}
  var html='';
  for(var i=0;i<lyrics.length;i++)html+='<div class="progress-dot'+(i===lIdx?' active':'')+'"></div>';
  el.innerHTML=html;
}

// ===== 播放控制 =====
function startPlay(){
  if(!lyrics.length){showToast('请先配置歌词');return}
  if(isPlaying)return;
  lIdx=0;updateLyrics();updateProgressDots();
  countdown(function(){
    var interval=parseFloat(document.getElementById('iInterval').value)||3.5;
    timer=setInterval(updateLyrics,interval*1000);isPlaying=true;updatePlayBtn();
  });
}

function stopPlay(){if(timer){clearInterval(timer);timer=null}isPlaying=false;updatePlayBtn()}
function resetLyrics(){lIdx=0;stopPlay();updateLyrics();updateProgressDots();showToast('已重置')}
function updatePlayBtn(){document.getElementById('btnPlay').textContent=isPlaying?'⏸':'▶'}
function showDoneHint(){var el=document.getElementById('doneHint');el.classList.add('show');setTimeout(function(){el.classList.remove('show')},3000)}

function countdown(cb){
  var overlay=document.getElementById('countdown'), numEl=document.getElementById('cdNum'), hintEl=document.getElementById('cdHint');
  overlay.classList.add('show');hintEl.textContent='下拉控制中心 → 长按录屏 → 开始';
  var nums=[3,2,1];
  function show(i){
    if(i>=nums.length){overlay.classList.remove('show');cb();return}
    numEl.textContent=nums[i];numEl.style.animation='none';void numEl.offsetWidth;numEl.style.animation='cdPop .8s ease-out';
    setTimeout(function(){show(i+1)},900);
  }
  show(0);
}

// ===== 图片替换 =====

}
function handleImage(e,type){

    userImages[type]=ev.target.result;
    document.getElementById(type==='cover'?'pickCover':(type==='bg'?'pickBg':'pickDisc')).classList.add('has-img');
    applyConfig();
    showToast({cover:'封面',bg:'背景',disc:'唱片'}[type]+'已替换 ✓');
  };
  reader.readAsDataURL(file);e.target.value='';
}

// ===== 触摸拖拽关闭抽屉 =====
(function(){
  var drawer=document.getElementById('drawer'), startY=0, currentY=0, dragging=false;
  drawer.addEventListener('touchstart',function(e){
    if(e.target.closest('.drawer-handle')||e.target===drawer){
      startY=e.touches[0].clientY;dragging=true;drawer.style.transition='none';
    }
  });
  drawer.addEventListener('touchmove',function(e){
    if(!dragging)return;currentY=e.touches[0].clientY;
    var diff=currentY-startY;if(diff>0)drawer.style.transform='translateY('+Math.min(diff,200)+'px)';
  });

// ===== 配置持久化 =====
function saveConfig(){
  var cfg={
    name:document.getElementById('iName').value,
    artist:document.getElementById('iArtist').value,
    style:document.getElementById('iStyle').value,
    color:document.getElementById('iColor').value,

    if(cfg.artist)document.getElementById('iArtist').value=cfg.artist;
    if(cfg.style)document.getElementById('iStyle').value=cfg.style;
    if(cfg.color)document.getElementById('iColor').value=cfg.color;
    if(cfg.interval)document.getElementById('iInterval').value=cfg.interval;
    if(cfg.lyrics)document.getElementById('iLyrics').value=cfg.lyrics;

}

// ===== Toast =====
function showToast(msg){

  setTimeout(function(){t.classList.remove('show')},1800);
}

// ===== 导出（Canvas方式，保留备用） =====
function loadImage(src){
  return new Promise(function(resolve,reject){
    if(src.indexOf('data:')===0){var img=new Image();img.onload=function(){resolve(img)};img.onerror=function(){reject()};img.src=src;return}
    fetch(src).then(function(r){if(!r.ok)throw new Error();return r.blob()}).then(function(blob){
      var url=URL.createObjectURL(blob),img=new Image();
      img.onload=function(){URL.revokeObjectURL(url);resolve(img)};img.onerror=function(){URL.revokeObjectURL(url);reject()};img.src=url;
    }).catch(function(){var img=new Image();img.onload=function(){resolve(img)};img.onerror=function(){reject()};img.src=src});
  });
}

  var vig=ctx.createRadialGradient(W/2,H/2,W*.3,W/2,H/2,W*.9);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.7)');ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  var tf=ctx.createLinearGradient(0,0,0,H*.15);tf.addColorStop(0,'rgba(0,0,0,.5)');tf.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=tf;ctx.fillRect(0,0,W,H*.15);

  ctx.restore();ctx.beginPath();ctx.arc(0,0,discR*.05,0,Math.PI*2);ctx.fillStyle='#0a0a12';ctx.fill();ctx.restore();

  ctx.shadowColor='rgba('+r+','+g+','+b+',.4)';ctx.shadowBlur=20;ctx.fillStyle='#fff';ctx.font='500 42px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(name,W/2,H*.54);ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='400 22px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText(artist,W/2,H*.585);ctx.font='400 16px "PingFang SC","Microsoft YaHei",sans-serif';var bw=ctx.measureText(style).width+30;ctx.strokeStyle='rgba('+r+','+g+','+b+',.4)';ctx.lineWidth=1;roundRect(ctx,W/2-bw/2,H*.615-13,bw,26,13);ctx.stroke();ctx.fillStyle='rgba('+r+','+g+','+b+',.8)';ctx.fillText(style,W/2,H*.615);

function canvasToBlob(c){return new Promise(function(r){c.toBlob(function(b){r(b)},'image/jpeg',.92)})}

async function exportFrames(){
  if(!window.JSZip){showToast('导出功能需要联网加载组件，核心播放不受影响');return}

  var name=document.getElementById('iName').value.trim()||'未命名',artist=document.getElementById('iArtist').value.trim()||'',style=document.getElementById('iStyle').value.trim()||'',color=document.getElementById('iColor').value;
  var discSrc=userImages.disc;if(!discSrc){showToast('请先替换一张唱片图再导出');return}

    drawFrame(ctx,W,H,opts,lyr.length);folder.file(String(total-1).padStart(2,'0')+'-outro.jpg',await canvasToBlob(canvas));
    var blob=await zip.generateAsync({type:'blob'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name+'-歌词图片.zip';document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},5000);showToast('导出完成！共'+total+'张');
  }catch(e){showToast('导出失败: '+e.message)}
}
</script>

</body>
