<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>非遗数字图案数据库</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#efece4;--ink:#1c1c1c;--muted:#6b675e;--line:rgba(28,28,28,.14);--red:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",sans-serif;background-image:linear-gradient(rgba(28,28,28,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(28,28,28,.045) 1px,transparent 1px);background-size:64px 64px}
.top{position:sticky;top:0;display:flex;align-items:center;padding:14px 28px;background:rgba(251,250,246,.92);border-bottom:1px solid var(--line)}
.seal{width:34px;height:34px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;margin-right:10px}
.hero{width:min(1080px,92vw);margin:48px auto 20px}
.hero h1{font-family:"Noto Serif SC",serif;font-size:clamp(36px,6vw,68px)}
.hero p{color:var(--muted);line-height:1.85;margin-top:14px}
.searchbar{width:min(1080px,92vw);margin:18px auto 28px;display:flex;border:1px solid #111;background:#fff}
.searchbar input{flex:1;border:0;padding:14px 16px;outline:none}
.searchbar button{border:0;background:#111;color:#fff;padding:0 22px}
.layout{width:min(1200px,94vw);margin:0 auto 80px;display:grid;grid-template-columns:160px 1fr;gap:24px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 0;cursor:pointer}
.side button.on{color:var(--red);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fbfaf6;border:1px solid var(--line);cursor:pointer}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#1a2230}
.card .body{padding:12px}
.card h3{font-family:"Noto Serif SC",serif;margin:6px 0}
.cat{color:var(--red);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.sheet{background:#f6f3ec;max-width:820px;width:100%;display:grid;grid-template-columns:1fr 1fr}
.sheet img{width:100%;min-height:240px;object-fit:cover;background:#1a2230}
.sheet .meta{padding:24px}
@media(max-width:800px){.layout,.grid,.sheet{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top"><span class="seal">纹</span><b>非遗数字图案数据库</b></header>
<section class="hero"><h1>非遗数字图案数据库</h1><p>可查询、可复用的数字文化资产。按门类与关键词检索纹样档案。</p></section>
<div class="searchbar"><input id="q" placeholder="输入关键词"/><button id="go">查询</button></div>
<div class="layout"><aside class="side" id="cats"></aside><div class="grid" id="grid"></div></div>
<div class="modal" id="modal"></div>
<script>
const CDN="https://cdn.jsdelivr.net/gh/liujiangchao57-svg/qianwen-buyi-sites@main/img/";
const CATS=["全部","织锦","刺绣","印染","陶瓷","壁画","剪纸","漆器","雕刻"];
const DATA=[
{name:"缠枝莲纹",cat:"织锦",src:"江苏南京·云锦",file:"pat-cloud.svg",meaning:"生生不息"},
{name:"布依菱花纹",cat:"刺绣",src:"贵州黔南·布依绣",file:"pat-diamond.svg",meaning:"菱形骨架"},
{name:"彩蝶纹",cat:"刺绣",src:"贵州黔南",file:"animal-butterfly.svg",meaning:"变化与姻缘"},
{name:"双鱼纹",cat:"刺绣",src:"贵州黔西南",file:"animal-fish.svg",meaning:"有余成双"},
{name:"青花缠枝莲",cat:"陶瓷",src:"景德镇",file:"plant-lotus.svg",meaning:"清雅"},
{name:"蓝印团花",cat:"印染",src:"南通",file:"pat-wan.svg",meaning:"团圆"},
{name:"云雷纹",cat:"壁画",src:"陕西",file:"pat-thunder.svg",meaning:"威仪"},
{name:"回纹",cat:"雕刻",src:"徽州",file:"pat-huiwen.svg",meaning:"循环"},
{name:"水波纹",cat:"织锦",src:"布依织锦",file:"pat-wave.svg",meaning:"河流"},
{name:"石榴纹",cat:"刺绣",src:"陕西",file:"plant-pomegranate.svg",meaning:"多子"},
{name:"太阳鸟",cat:"刺绣",src:"布依绣",file:"myth-sunbird.svg",meaning:"光明"}
];
let cat="全部",q="";
function render(){
 document.getElementById("cats").innerHTML=CATS.map(c=>`<button class="${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
 const list=DATA.filter(p=>(cat==="全部"||p.cat===cat)&&(!q||(p.name+p.src+p.meaning+p.cat).includes(q)));
 document.getElementById("grid").innerHTML=list.map(p=>`<article class="card" data-name="${p.name}"><img src="${CDN+p.file}"><div class="body"><div class="cat">${p.cat}</div><h3>${p.name}</h3><div style="color:#777;font-size:13px">${p.src}</div></div></article>`).join("")||"<p>未检索到</p>";
}
document.getElementById("cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.c;render()};
document.getElementById("go").onclick=()=>{q=document.getElementById("q").value.trim();render()};
document.getElementById("grid").onclick=e=>{
 const card=e.target.closest(".card"); if(!card)return;
 const p=DATA.find(x=>x.name===card.dataset.name); if(!p)return;
 const m=document.getElementById("modal");
 m.innerHTML=`<div class="sheet"><img src="${CDN+p.file}"><div class="meta"><div class="cat">${p.cat}</div><h2>${p.name}</h2><p>${p.src}</p><p>${p.meaning}</p><button onclick="document.getElementById('modal').classList.remove('show')">关闭</button></div></div>`;
 m.classList.add("show"); m.onclick=ev=>{if(ev.target===m)m.classList.remove("show")};
};
render();
</script></body></html>
